          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly, Secure, SameSite=Lax server-side session cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for session-authenticated state-changing operations.
    hmacV1:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256 v1 signature; all signature headers are required.
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantIdQuery:
      name: tenantId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiId:
      name: apiId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrchestrationId:
      name: orchestrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PublicPath:
      name: path
      in: path
      required: true
      description: Registered public path suffix after /open/v1/.
      schema:
        type: string
        minLength: 1
        maxLength: 1000
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromDate:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ToDate:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    TenantStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TenantStatus"
    ApiStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ApiStatus"
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._~-]+$"
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._~-]+$"
    SignatureVersion:
      name: X-Signature-Version
      in: header
      required: true
      schema:
        const: v1
    AppKey:
      name: X-App-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: "^[0-9]{10}$"
    Nonce:
      name: X-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
    Signature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    ClientRequestId:
      name: X-Client-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    RequestId:
      description: Server-generated request correlation ID.
      schema:
        type: string
        format: uuid
    SessionCookie:
      description: Secure server-side session cookie.
      schema:
        type: string
    RateLimitLimit:
      description: The strictest applicable request limit in the active window.
      schema:
        type: integer
        minimum: 0
    RateLimitRemaining:
      description: Remaining requests in the active window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the active window resets.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds the client should wait before retrying.
      schema:
        type: integer
        minimum: 0
  responses:
    PublicSuccess:
      description: Business success response from a registered API or orchestration.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicSuccessEnvelope"
        text/plain:
          schema:
            type: string
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: Request body or framing exceeds the configured limit
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authorization or lifecycle state denied the operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State, version, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Semantically invalid configuration or DSL
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit or quota exceeded
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream returned an unusable response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal platform failure
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Required platform dependency or auth state is unavailable
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GatewayTimeout:
      description: Upstream or orchestration deadline exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId, retryable]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        message:
          type: string
          maxLength: 500
        requestId:
          type: string
          format: uuid
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    SessionLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 256
        mfaCode:
          type: string
          pattern: "^[0-9]{6}$"
    SessionResponse:
      type: object
      additionalProperties: false
      required: [userId, email, displayName, roles, expiresAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 100
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
        expiresAt:
          type: string
          format: date-time
    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operationId, acceptedAt]
      properties:
        operationId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
    RoleCode:
      type: string
      enum: [PLATFORM_ADMIN, APP_DEVELOPER, VIEWER]
    RoleBinding:
      type: object
      additionalProperties: false
      required: [id, userId, roleCode, scopeType]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        tenantId:
          type: [string, "null"]
          format: uuid
        roleCode:
          $ref: "#/components/schemas/RoleCode"
        scopeType:
          type: string
          enum: [GLOBAL, TENANT]
    RoleBindingCreateRequest:
      type: object
      additionalProperties: false
      required: [tenantId, roleCode]
      properties:
        tenantId:
          type: string
          format: uuid
        roleCode:
          type: string
          enum: [APP_DEVELOPER, VIEWER]
    UserInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, tenantId, roleCode]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          maxLength: 100
        tenantId:
          type: string
          format: uuid
        roleCode:
          type: string
          enum: [APP_DEVELOPER, VIEWER]
    TenantStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    Tenant:
      type: object
      additionalProperties: false
      required: [id, code, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,31}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: "#/components/schemas/TenantStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TenantCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,31}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
    TenantPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: "#/components/schemas/TenantStatus"
        expectedUpdatedAt:
          type: string
          format: date-time
    TenantPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        page:
          $ref: "#/components/schemas/PageMeta"
    HttpMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE]
    UpstreamEnvironmentName:
      type: string
      enum: [PROD, SANDBOX]
    UpstreamEndpoint:
      type: object
      additionalProperties: false
      required: [id, code, name, method, pathTemplate, status, environments]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,63}$"
        name:
          type: string
          maxLength: 120
        method:
          $ref: "#/components/schemas/HttpMethod"
        pathTemplate:
          type: string
          pattern: "^/.*$"
          maxLength: 1000
        status:
          type: string
          enum: [ACTIVE, OFFLINE]
        environments:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamEnvironment"
    UpstreamEndpointCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, method, pathTemplate]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        method:
          $ref: "#/components/schemas/HttpMethod"
        pathTemplate:
          type: string
          pattern: "^/.*$"
          maxLength: 1000
    UpstreamEndpointPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        pathTemplate:
          type: string
          pattern: "^/.*$"
          maxLength: 1000
        status:
          type: string
          enum: [ACTIVE, OFFLINE]
        expectedUpdatedAt:
          type: string
          format: date-time
    UpstreamEnvironment:
      type: object
      additionalProperties: false
      required: [id, environment, version, baseUrl, egressZone, tlsPolicy, status]
      properties:
        id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/UpstreamEnvironmentName"
        version:
          type: integer
          minimum: 1
        baseUrl:
          type: string
          format: uri
          pattern: "^https://"
        authRef:
          type: [string, "null"]
          maxLength: 200
        egressZone:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        tlsPolicy:
          type: string
          enum: [TLS_1_2_STRICT, TLS_1_3_STRICT]
        status:
          type: string
          enum: [ACTIVE, OFFLINE]
    UpstreamEnvironmentCreateRequest:
      type: object
      additionalProperties: false
      required: [environment, baseUrl, egressZone, tlsPolicy]
      properties:
        environment:
          $ref: "#/components/schemas/UpstreamEnvironmentName"
        baseUrl:
          type: string
          format: uri
          pattern: "^https://"
        authRef:
          type: [string, "null"]
          maxLength: 200
        egressZone:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        tlsPolicy:
          type: string
          enum: [TLS_1_2_STRICT, TLS_1_3_STRICT]
    UpstreamEnvironmentPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        baseUrl:
          type: string
          format: uri
          pattern: "^https://"
        authRef:
          type: [string, "null"]
          maxLength: 200
        egressZone:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        tlsPolicy:
          type: string
          enum: [TLS_1_2_STRICT, TLS_1_3_STRICT]
        status:
          type: string
          enum: [ACTIVE, OFFLINE]
    UpstreamEndpointPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamEndpoint"
        page:
          $ref: "#/components/schemas/PageMeta"
    ApiStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, PUBLISHED, DEPRECATED, OFFLINE]
    ApiKind:
      type: string
      enum: [PROXY, ORCHESTRATION]
    Visibility:
      type: string
      enum: [PLATFORM_PUBLIC, TENANT_PRIVATE]
    ApiDefinition:
      type: object
      additionalProperties: false
      required:
        - id
        - ownerTenantId
        - code
        - name
        - publicMethod
        - publicPath
        - kind
        - visibility
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        ownerTenantId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,63}$"
        name:
          type: string
          maxLength: 120
        publicMethod:
          $ref: "#/components/schemas/HttpMethod"
        publicPath:
          type: string
          pattern: "^/[A-Za-z0-9._~/-]+$"
          maxLength: 1000
        kind:
          $ref: "#/components/schemas/ApiKind"
        visibility:
          $ref: "#/components/schemas/Visibility"
        activeProdPublicationId:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/ApiStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiDefinitionCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, publicMethod, publicPath, kind, visibility]
      properties:
        ownerTenantId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        publicMethod:
          $ref: "#/components/schemas/HttpMethod"
        publicPath:
          type: string
          pattern: "^/[A-Za-z0-9._~/-]+$"
          maxLength: 1000
        kind:
          $ref: "#/components/schemas/ApiKind"
        visibility:
          $ref: "#/components/schemas/Visibility"
    ApiDefinitionPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        visibility:
          $ref: "#/components/schemas/Visibility"
        expectedUpdatedAt:
          type: string
          format: date-time
    ProxyApiConfig:
      type: object
      additionalProperties: false
      required: [upstreamEndpointId]
      properties:
        upstreamEndpointId:
          type: string
          format: uuid
        requestMapping:
          type: object
          additionalProperties: true
        responseMapping:
          type: object
          additionalProperties: true
    OrchestrationApiConfig:
      type: object
      additionalProperties: false
      required: [orchestrationVersionId]
      properties:
        orchestrationVersionId:
          type: string
          format: uuid
    ApiVersionCreateRequest:
      type: object
      additionalProperties: false
      required: [version, requestSchema, responseSchema, timeoutMs, config]
      properties:
        version:
          type: string
          pattern: "^[1-9][0-9]*$"
        requestSchema:
          type: object
          additionalProperties: true
        responseSchema:
          type: object
          additionalProperties: true
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 30000
        config:
          oneOf:
            - $ref: "#/components/schemas/ProxyApiConfig"
            - $ref: "#/components/schemas/OrchestrationApiConfig"
    ApiVersion:
      type: object
      additionalProperties: false
      required: [id, apiId, version, status, requestSchema, responseSchema, timeoutMs, configChecksum, createdAt]
      properties:
        id:
          type: string
          format: uuid
        apiId:
          type: string
          format: uuid
        version:
          type: string
          pattern: "^[1-9][0-9]*$"
        status:
          type: string
          enum: [DRAFT, PUBLISHED, DEPRECATED, OFFLINE]
        requestSchema:
          type: object
          additionalProperties: true
        responseSchema:
          type: object
          additionalProperties: true
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 30000
        configChecksum:
          type: string
          pattern: "^[0-9a-f]{64}$"
        createdAt:
          type: string
          format: date-time
    ApiDefinitionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiDefinition"
        page:
          $ref: "#/components/schemas/PageMeta"
    ApiPublicationCreateRequest:
      type: object
      additionalProperties: false
      required: [apiId, apiVersionId, visibility]
      properties:
        apiId:
          type: string
          format: uuid
        apiVersionId:
          type: string
          format: uuid
        visibility:
          $ref: "#/components/schemas/Visibility"
    ApiPublication:
      type: object
      additionalProperties: false
      required: [id, apiId, apiVersionId, visibility, environment, status, manifestChecksum, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        apiId:
          type: string
          format: uuid
        apiVersionId:
          type: string
          format: uuid
        visibility:
          $ref: "#/components/schemas/Visibility"
        environment:
          type: string
          const: PROD
        status:
          type: string
          enum: [PREPARED, ACTIVE, SUPERSEDED, REVOKED]
          description: >
            PREPARED may be published, ACTIVE or SUPERSEDED may be activated by
            rollback, and REVOKED may never become the production pointer.
        manifestChecksum:
          type: string
          pattern: "^[0-9a-f]{64}$"
        publishedAt:
          type: string
          format: date-time
      x-publication-guard-rules:
        - environment must equal PROD
        - apiId must match the API definition
        - ownerTenantId must match the API definition
        - visibility must match the API definition
        - REVOKED publications cannot be activated
    ScopeType:
      type: string
      enum: [PLATFORM, TENANT, APP, API]
    RateLimitPolicy:
      type: object
      additionalProperties: false
      required: [id, scopeType, scopeId, limit, windowSeconds, burst, algorithm, enabled]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: [string, "null"]
          format: uuid
        scopeType:
          $ref: "#/components/schemas/ScopeType"
        scopeId:
          type: string
          maxLength: 100
        limit:
          type: integer
          minimum: 1
        windowSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        burst:
          type: integer
          minimum: 0
        algorithm:
          type: string
          const: TOKEN_BUCKET
        enabled:
          type: boolean
    RateLimitPolicyCreateRequest:
      type: object
      additionalProperties: false
      required: [scopeType, scopeId, limit, windowSeconds, burst]
      properties:
        tenantId:
          type: [string, "null"]
          format: uuid
        scopeType:
          $ref: "#/components/schemas/ScopeType"
        scopeId:
          type: string
          maxLength: 100
        limit:
          type: integer
          minimum: 1
        windowSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        burst:
          type: integer
          minimum: 0
    RateLimitPolicyPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        limit:
          type: integer
          minimum: 1
        windowSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        burst:
          type: integer
          minimum: 0
        enabled:
          type: boolean
    QuotaPolicy:
      type: object
      additionalProperties: false
