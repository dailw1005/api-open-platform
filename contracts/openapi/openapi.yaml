openapi: 3.1.0
info:
  title: API Open Platform Gateway and Control Plane
  version: 0.1.0
  description: |
    Authoritative HTTP contract for the API Open Platform MVP.
    Session APIs are used by the management and developer portals.
    Public application traffic enters /open/v1/** and uses HMAC v1.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: AdminAuth
  - name: DeveloperAuth
  - name: Tenants
  - name: Users
  - name: Upstreams
  - name: APIs
  - name: Publications
  - name: Policies
  - name: Apps
  - name: Credentials
  - name: Grants
  - name: Orchestrations
  - name: Operations
  - name: PublicGateway
paths:
  /platform-admin/v1/sessions:
    post:
      tags: [AdminAuth]
      operationId: createAdminSession
      summary: Sign in to the platform administration portal
      security: []
      x-auth-kind: NONE
      x-required-role: NONE
      x-tenant-scope: GLOBAL
      x-csrf-required: false
      x-idempotency: OPTIONAL
      x-contract-version: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionLoginRequest"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /platform-admin/v1/sessions/current:
    delete:
      tags: [AdminAuth]
      operationId: deleteAdminSession
      summary: Sign out of the platform administration portal
      security:
        - sessionCookie: []
          csrfToken: []
      x-auth-kind: SESSION
      x-required-role: PLATFORM_ADMIN
      x-tenant-scope: GLOBAL
      x-csrf-required: true
      x-idempotency: REQUIRED
      x-contract-version: "1"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      responses:
        "204":
          description: Session revoked
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /developer/v1/sessions:
    post:
      tags: [DeveloperAuth]
      operationId: createDeveloperSession
      summary: Sign in to the developer portal
      security: []
      x-auth-kind: NONE
      x-required-role: NONE
      x-tenant-scope: GLOBAL
      x-csrf-required: false
      x-idempotency: OPTIONAL
      x-contract-version: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
